query aiAgents($workspaceId: ID!) {
    aiAgents(workspaceId: $workspaceId) {
        id
        uuid
        name
        title
        description
        projectId
        unpublishedChanges
        lastPublishedVersion
        publishedDate
        lastModifiedDate
        visibility
        tags {
            id
            name
        }
        elements {
            id
            kind
        }
        channels {
            id
            channelType
            parameters
        }
    }
}
