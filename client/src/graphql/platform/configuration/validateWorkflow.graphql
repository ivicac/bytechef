query ValidateWorkflow(
    $workflowDefinition: String!
    $workflowId: String
    $workspaceId: Long
    $environmentId: Long
) {
    validateWorkflow(
        workflow: $workflowDefinition
        workflowId: $workflowId
        workspaceId: $workspaceId
        environmentId: $environmentId
    ) {
        errors
        warnings
        nodeIssues {
            nodeName
            propertyPath
            kind
            severity
            message
        }
    }
}
