openapi: 3.0.1
info:
  title: The Embedded Configuration Internal API
  version: "1"
servers:
- url: /api/embedded/internal
tags:
- description: The Embedded App Event Internal API
  name: app-event
- description: The Embedded Category Internal API
  name: category
- description: The Embedded Component Definition Internal API
  name: component-definition
- description: The Embedded Connection Tag Internal API
  name: connection-tag
- description: The Embedded Connected User Project Workflow Internal API
  name: connected-user-project-workflow
- description: The Embedded Connection Internal API
  name: connection
- description: The Embedded Tag Internal API
  name: integration-tag
- description: The Embedded Integration Internal API
  name: integration
- description: The Embedded Integration Code Workflow Internal API
  name: integration-code-workflow
- description: The Embedded Unified Integration Management Internal API
  name: unified-integration
- description: The Automation Webhook Trigger Internal API
  name: webhook-trigger-test
- description: The Embedded Workflow Internal API
  name: workflow
paths:
  /component-definitions:
    get:
      description: Get all component definitions.
      operationId: getComponentDefinitions
      parameters:
      - description: Use for filtering components which define action definitions.
        explode: true
        in: query
        name: actionDefinitions
        required: false
        schema:
          type: boolean
        style: form
      - description: Use for filtering components which define cluster element definitions.
        explode: true
        in: query
        name: clusterElementDefinitions
        required: false
        schema:
          type: boolean
        style: form
      - description: Use for filtering components which define connection definitions.
        explode: true
        in: query
        name: connectionDefinitions
        required: false
        schema:
          type: boolean
        style: form
      - description: Use for filtering components which define trigger definitions.
        explode: true
        in: query
        name: triggerDefinitions
        required: false
        schema:
          type: boolean
        style: form
      - description: The list of component names to include in the result.
        explode: true
        in: query
        name: include
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ComponentDefinitionBasic"
                type: array
          description: Successful operation.
      summary: Get all component definitions
      tags:
      - component-definition
      x-accepts:
      - application/json
  /app-events:
    get:
      description: Get app events.
      operationId: getAppEvents
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AppEvent"
                type: array
          description: The list of app events.
      summary: Get app events
      tags:
      - app-event
      x-accepts:
      - application/json
    post:
      description: Create a new app event.
      operationId: createAppEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppEvent"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                format: int64
                type: integer
          description: The app event id.
      summary: Create a new app event
      tags:
      - app-event
      x-content-type: application/json
      x-accepts:
      - application/json
  /app-events/{id}:
    delete:
      description: Delete an app event.
      operationId: deleteAppEvent
      parameters:
      - description: The id of an app event.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: Successful operation.
      summary: Delete an app event
      tags:
      - app-event
      x-accepts:
      - application/json
    get:
      description: Get an app event by id.
      operationId: getAppEvent
      parameters:
      - description: The id of an app event.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppEvent"
          description: The app event object.
      summary: Get an app event by id
      tags:
      - app-event
      x-accepts:
      - application/json
    put:
      description: Update an existing app event.
      operationId: updateAppEvent
      parameters:
      - description: The id of an app event.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppEvent"
        required: true
      responses:
        "204":
          description: Successful operation.
      summary: Update an existing app event
      tags:
      - app-event
      x-content-type: application/json
      x-accepts:
      - application/json
  /connections:
    get:
      description: Get all connections.
      operationId: getConnections
      parameters:
      - description: The component name used for filtering connections.
        explode: true
        in: query
        name: componentName
        required: false
        schema:
          type: string
        style: form
      - description: The connection version.
        explode: true
        in: query
        name: connectionVersion
        required: false
        schema:
          type: integer
        style: form
      - description: The environment id.
        explode: true
        in: query
        name: environmentId
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: The tag id of used for filtering connections.
        explode: true
        in: query
        name: tagId
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Connection"
                type: array
          description: The list of connections.
      summary: Get all connections
      tags:
      - connection
      x-accepts:
      - application/json
    post:
      description: Create a new connection.
      operationId: createConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Connection"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                format: int64
                type: integer
          description: The connection id.
      summary: Create a new connection
      tags:
      - connection
      x-content-type: application/json
      x-accepts:
      - application/json
  /connections/tags:
    get:
      description: Get connection tags.
      operationId: getConnectionTags
      responses:
        "200":
          content:
            application/json:
              schema:
                description: The response object that contains the array of tags.
                items:
                  $ref: "#/components/schemas/Tag"
                type: array
          description: The list of connection tags.
      summary: Get connection tags
      tags:
      - connection-tag
      x-accepts:
      - application/json
  /connections/{id}:
    delete:
      description: Delete a connection.
      operationId: deleteConnection
      parameters:
      - description: The id of a connection.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: Successful operation.
      summary: Delete a connection
      tags:
      - connection
      x-accepts:
      - application/json
    get:
      description: Get a connection by id.
      operationId: getConnection
      parameters:
      - description: The id of a connection.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
          description: The connection object.
      summary: Get a connection by id
      tags:
      - connection
      x-accepts:
      - application/json
    patch:
      description: Update an existing connection.
      operationId: updateConnection
      parameters:
      - description: The id of a connection.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnectionRequest"
        required: true
      responses:
        "204":
          description: Successful operation.
      summary: Update an existing connection
      tags:
      - connection
      x-content-type: application/json
      x-accepts:
      - application/json
  /connections/{id}/tags:
    put:
      description: Updates tags of an existing connection.
      operationId: updateConnectionTags
      parameters:
      - description: The id of the connection.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagsRequest"
        required: true
      responses:
        "204":
          description: Successful operation.
      summary: Updates tags of an existing connection
      tags:
      - connection-tag
      x-content-type: application/json
      x-accepts:
      - application/json
  /connected-users/{connectedUserId}/components/{componentName}/connections:
    get:
      description: Get all connected user's connections.
      operationId: getConnectedUserConnections
      parameters:
      - description: The id of a connected user.
        explode: false
        in: path
        name: connectedUserId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - description: The component name.
        explode: false
        in: path
        name: componentName
        required: true
        schema:
          type: string
        style: simple
      - description: The list of allowed connection ids.
        explode: true
        in: query
        name: connectionIds
        required: false
        schema:
          items:
            format: int64
            type: integer
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Connection"
                type: array
          description: The list of connections.
      summary: Get all connected user's connections
      tags:
      - connection
      x-accepts:
      - application/json
  /connected-users/{connectedUserId}/connections:
    post:
      description: Create a new connection for the connected user.
      operationId: createConnectedUserConnection
      parameters:
      - description: The id of a connected user.
        explode: false
        in: path
        name: connectedUserId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Connection"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                format: int64
                type: integer
          description: The connection id.
      summary: Create a new connection for the connected user
      tags:
      - connection
      x-content-type: application/json
      x-accepts:
      - application/json
  /connected-user-project-workflows/{workflowUuid}:
    get:
      description: Get connected user project workflow.
      operationId: getConnectedUserProjectWorkflow
      parameters:
      - description: The environment.
        explode: false
        in: header
        name: X-Environment
        required: false
        schema:
          $ref: "#/components/schemas/Environment"
        style: simple
      - description: The workflow uuid.
        explode: false
        in: path
        name: workflowUuid
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedUserProjectWorkflow"
          description: The connected user project workflow object.
      summary: Get connected user project workflow.
      tags:
      - connected-user-project-workflow
      x-accepts:
      - application/json
  /connected-user-project-workflows/{workflowUuid}/publish:
    post:
      description: Publishes existing connected user project workflow.
      operationId: publishConnectedUserProjectWorkflow
      parameters:
      - description: The environment.
        explode: false
        in: header
        name: X-Environment
        required: false
        schema:
          $ref: "#/components/schemas/Environment"
        style: simple
      - description: The workflow uuid.
        explode: false
        in: path
        name: workflowUuid
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/publishConnectedUserProjectWorkflow_request"
        required: true
      responses:
        "204":
          description: Successful operation.
      summary: Publishes existing connected user project workflow
      tags:
      - connected-user-project-workflow
      x-content-type: application/json
      x-accepts:
      - application/json
  /connected-user-project-workflows/{workflowUuid}/enable/{enable}:
    patch:
      description: Enable/disable a connected user project workflow.
      operationId: enableConnectedUserProjectWorkflow
      parameters:
      - description: The environment.
        explode: false
        in: header
        name: X-Environment
        required: false
        schema:
          $ref: "#/components/schemas/Environment"
        style: simple
      - description: The workflow uuid.
        explode: false
        in: path
        name: workflowUuid
        required: true
        schema:
          type: string
        style: simple
      - description: Enable/disable the project deployment.
        explode: false
        in: path
        name: enable
        required: true
        schema:
          type: boolean
        style: simple
      responses:
        "204":
          description: Successful operation.
      summary: Enable/disable a connected user project workflow
      tags:
      - connected-user-project-workflow
      x-accepts:
      - application/json
  /integration-instance-configurations/tags:
    get:
      description: Get integration instance configuration tags.
      operationId: getIntegrationInstanceConfigurationTags
      responses:
        "200":
          content:
            application/json:
              schema:
                description: The response object that contains the array of tags.
                items:
                  $ref: "#/components/schemas/Tag"
                type: array
          description: The list of integration instance configuration tags.
      summary: Get integration instance configuration tags
      tags:
      - integration-instance-configuration-tag
      x-accepts:
      - application/json
  /integration-instance-configurations:
    get:
      description: Get integration instance configurations.
      operationId: getIntegrationInstanceConfigurations
      parameters:
      - description: The environment id.
        explode: true
        in: query
        name: environmentId
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: The integration id used for filtering integration instance configurations.
        explode: true
        in: query
        name: integrationId
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: The tag id of used for filtering integration instance configurations.
        explode: true
        in: query
        name: tagId
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Use for including all fields or just basic ones.
        explode: true
        in: query
        name: includeAllFields
        required: false
        schema:
          default: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/IntegrationInstanceConfiguration"
                type: array
          description: The list of integration instance configurations.
      summary: Get integration instance configurations
      tags:
      - integration-instance-configuration
      x-accepts:
      - application/json
    post:
      description: Create a new integration instance configuration.
      operationId: createIntegrationInstanceConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationInstanceConfiguration"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                format: int64
                type: integer
          description: The integration instance configuration id.
      summary: Create a new integration instance configuration
      tags:
      - integration-instance-configuration
      x-content-type: application/json
      x-accepts:
      - application/json
  /integration-instance-configurations/{id}:
    delete:
      description: Delete an integration instance configuration.
      operationId: deleteIntegrationInstanceConfiguration
      parameters:
      - description: The id of an integration instance configuration.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: Successful operation.
      summary: Delete an integration instance configuration
      tags:
      - integration-instance-configuration
      x-accepts:
      - application/json
    get:
      description: Get an integration instance configuration by id.
      operationId: getIntegrationInstanceConfiguration
      parameters:
      - description: The id of an integration instance configuration.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationInstanceConfiguration"
          description: The integration instance configuration object.
      summary: Get an integration instance configuration by id
      tags:
      - integration-instance-configuration
      x-accepts:
      - application/json
    put:
      description: Update an existing integration instance configuration.
      operationId: updateIntegrationInstanceConfiguration
      parameters:
      - description: The id of an integration instance configuration.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationInstanceConfiguration"
        required: true
      responses:
        "204":
          description: Successful operation.
      summary: Update an existing integration instance configuration
      tags:
      - integration-instance-configuration
      x-content-type: application/json
      x-accepts:
      - application/json
  /integration-instance-configurations/{id}/enable/{enable}:
    patch:
      description: Enable/disable an integration instance configuration.
      operationId: enableIntegrationInstanceConfiguration
      parameters:
      - description: The id of an integration instance configuration.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - description: Enable/disable the integration instance configuration.
        explode: false
        in: path
        name: enable
        required: true
        schema:
          type: boolean
        style: simple
      responses:
        "204":
          description: Successful operation.
      summary: Enable/disable an integration instance configuration
      tags:
      - integration-instance-configuration
      x-accepts:
      - application/json
  /integration-instance-configurations/{id}/tags:
    put:
      description: Updates tags of an existing integration instance configuration.
      operationId: updateIntegrationInstanceConfigurationTags
      parameters:
      - description: The id of an integration instance configuration.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagsRequest"
        required: true
      responses:
        "204":
          description: Successful operation.
      summary: Updates tags of an existing integration instance configuration
      tags:
      - integration-instance-configuration-tag
      x-content-type: application/json
      x-accepts:
      - application/json
  /integration-instance-configurations/{id}/workflows/{workflowId}/enable/{enable}:
    patch:
      description: Enable/disable a workflow of an integration instance configuration.
      operationId: enableIntegrationInstanceConfigurationWorkflow
      parameters:
      - description: The id of an integration instance configuration.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - description: The id of an integration workflow.
        explode: false
        in: path
        name: workflowId
        required: true
        schema:
          type: string
        style: simple
      - description: Enable/disable the workflow of an integration instance configuration.
        explode: false
        in: path
        name: enable
        required: true
        schema:
          type: boolean
        style: simple
      responses:
        "204":
          description: Successful operation.
      summary: Enable/disable a workflow of an integration instance configuration
      tags:
      - integration-instance-configuration
      x-accepts:
      - application/json
  /integration-instance-configurations/{id}/workflows/{workflowId}:
    put:
      description: Update an existing integration instance configuration workflow.
      operationId: updateIntegrationInstanceConfigurationWorkflow
      parameters:
      - description: The id of an integration instance configuration.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - description: The id of an integration instance configuration workflow.
        explode: false
        in: path
        name: workflowId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationInstanceConfigurationWorkflow"
        required: true
      responses:
        "204":
          description: Successful operation.
      summary: Update an existing integration instance configuration workflow
      tags:
      - integration-instance-configuration
      x-content-type: application/json
      x-accepts:
      - application/json
  /integration-instance-configurations/{id}/workflows/{workflowId}/jobs:
    post:
      description: Create a request for running a new job.
      operationId: createIntegrationInstanceConfigurationWorkflowJob
      parameters:
      - description: The id of an integration instance configuration.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - description: The id of the workflow to execute.
        explode: false
        in: path
        name: workflowId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createIntegrationInstanceConfigurationWorkflowJob_200_response"
          description: The id of a created job.
      summary: Create a request for running a new job
      tags:
      - integration-instance-configuration
      x-accepts:
      - application/json
  /integration-instances/{id}:
    delete:
      description: Delete an integration instance.
      operationId: deleteIntegrationInstance
      parameters:
      - description: The id of an integration instance.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: Successful operation.
      summary: Delete an integration instance
      tags:
      - integration-instance
      x-accepts:
      - application/json
    get:
      description: Get an integration instance by id.
      operationId: getIntegrationInstance
      parameters:
      - description: The id of an integration instance.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationInstance"
          description: The integration instance object.
      summary: Get an integration instance by id
      tags:
      - integration-instance
      x-accepts:
      - application/json
  /integration-instances/{id}/enable/{enable}:
    patch:
      description: Enable/disable an integration instance.
      operationId: enableIntegrationInstance
      parameters:
      - description: The id of an integration instance.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - description: Enable/disable the integration instance.
        explode: false
        in: path
        name: enable
        required: true
        schema:
          type: boolean
        style: simple
      responses:
        "204":
          description: Successful operation.
      summary: Enable/disable an integration instance
      tags:
      - integration-instance
      x-accepts:
      - application/json
  /integration-instances/{id}/workflows/{workflowId}/enable/{enable}:
    patch:
      description: Enable/disable an integration instance workflow.
      operationId: enableIntegrationInstanceWorkflow
      parameters:
      - description: The id of an integration instance.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - description: The id of an integration instance workflow.
        explode: false
        in: path
        name: workflowId
        required: true
        schema:
          type: string
        style: simple
      - description: Enable/disable the integration instance workflow.
        explode: false
        in: path
        name: enable
        required: true
        schema:
          type: boolean
        style: simple
      responses:
        "204":
          description: Successful operation.
      summary: Enable/disable an integration instance workflow
      tags:
      - integration-instance
      x-accepts:
      - application/json
  /integrations:
    get:
      description: Get integrations.
      operationId: getIntegrations
      parameters:
      - description: The category id used for filtering integrations.
        explode: true
        in: query
        name: categoryId
        required: false
        schema:
          format: int64
          type: integer
